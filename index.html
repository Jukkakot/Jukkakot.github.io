<!doctype html>
<html lang="fi">
<head>

  <meta name="description" content="Kokoelma selaimessa pelattavia pelejä.">
  <link rel="stylesheet" href="style.css">

    <a class="card" href="https://jukkakot.github.io/word-games/">

    <a class="card" href="MineSweeper/">
      <img src="images/minesweeper.jpg" alt="Miinaharava-pelin ruudukko" width="800" height="600" loading="lazy">
      <span class="info"><span class="name">Miinaharava</span><span class="year">2020</span></span>

  <footer>
    <a href="https://github.com/Jukkakot">github.com/Jukkakot</a>
